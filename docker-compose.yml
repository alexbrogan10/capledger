services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capledger_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-capledger}
    ports:
      - "5432:5432"
    volumes:
      - capledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-capledger}:${POSTGRES_PASSWORD:-capledger_dev_pw}@db:5432/${POSTGRES_DB:-capledger}
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:80"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  capledger_pgdata:
